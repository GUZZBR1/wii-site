<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Measurement chain</title><desc id="d">Gesture, system and visible response, with the latency between them.</desc><rect width="1200" height="300" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Latency measurement chain (system as a black box)</text><rect x="40" y="100" width="340" height="64" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="210.0" y="137.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Observable gesture</text><rect x="420" y="100" width="340" height="64" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="590.0" y="137.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Camera-assisted drawing system</text><line x1="384" y1="132.0" x2="416" y2="132.0" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><rect x="800" y="100" width="340" height="64" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="970.0" y="137.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Visible response</text><line x1="764" y1="132.0" x2="796" y2="132.0" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><text x="210" y="200" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#647178" text-anchor="middle">t₀: gesture instant</text><text x="950" y="200" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#647178" text-anchor="middle">t₁: response appears</text><line x1="210" y1="215" x2="950" y2="215" stroke="#647178" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="545" y="255" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#3E6F78" text-anchor="middle">end-to-end latency = t₁ − t₀ (measured by external camera)</text></svg>
