<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Reproducibility levels</title><desc id="d">Three repetition categories with gradual changes in team, materials and implementation.</desc><rect width="1200" height="330" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Levels of repeating an evaluation</text><rect x="70" y="115" width="310" height="105" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="225.0" y="172.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Repeat</text><rect x="435" y="115" width="310" height="105" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="590.0" y="172.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Replicate</text><line x1="384" y1="167.5" x2="431" y2="167.5" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><rect x="800" y="115" width="310" height="105" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="955.0" y="172.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Reproduce</text><line x1="749" y1="167.5" x2="796" y2="167.5" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><text x="225" y="245" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#647178" text-anchor="middle">same team and materials</text><text x="590" y="245" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#647178" text-anchor="middle">another team, shared protocol</text><text x="955" y="245" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#647178" text-anchor="middle">independent implementation</text><text x="600" y="270" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">Terms depend on the adopted convention; state the definition used</text></svg>
