<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Conceptual barrier map</title><desc id="d">Six accessibility dimensions organized for contextual evaluation.</desc><rect width="1200" height="420" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Barrier dimensions to investigate</text><rect x="45" y="110" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="215.0" y="160.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Motor</text><text x="215.0" y="180.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">reach and control</text><rect x="430" y="110" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="600.0" y="160.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Visual</text><text x="600.0" y="180.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">perception and contrast</text><rect x="815" y="110" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="985.0" y="160.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Cognitive</text><text x="985.0" y="180.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">understanding and memory</text><rect x="45" y="265" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="215.0" y="315.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Equipment</text><text x="215.0" y="335.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">availability and fit</text><rect x="430" y="265" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="600.0" y="315.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Space</text><text x="600.0" y="335.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">surface and mobility</text><rect x="815" y="265" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="985.0" y="315.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Connectivity</text><text x="985.0" y="335.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">access and continuity</text></svg>
