<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-label="Caution tape">
  <defs>
    <!-- Diagonal hazard stripes: black bands over safety yellow -->
    <pattern id="hz" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="56" height="56" fill="#f8c809"/>
      <rect width="28" height="56" fill="#16130a"/>
    </pattern>

    <!-- Vertical sheen: light on the top edge, shade on the bottom edge -->
    <linearGradient id="edge-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset=".22" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".32"/>
    </linearGradient>

    <!-- Darkened ends, as if the tape were folded/anchored -->
    <linearGradient id="end-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity=".38"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="end-r" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity=".38"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <filter id="ds" x="-10%" y="-60%" width="120%" height="240%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity=".28"/>
    </filter>

    <clipPath id="tape">
      <path d="M0 52 Q600 112 1200 52 L1200 112 Q600 172 0 112 Z"/>
    </clipPath>
  </defs>

  <!-- Tape body with soft drop shadow -->
  <g filter="url(#ds)">
    <path d="M0 52 Q600 112 1200 52 L1200 112 Q600 172 0 112 Z" fill="url(#hz)"/>
  </g>

  <!-- Depth pass, clipped to the tape shape -->
  <g clip-path="url(#tape)">
    <path d="M0 52 Q600 112 1200 52 L1200 112 Q600 172 0 112 Z" fill="url(#edge-shade)"/>
    <rect width="110" height="210" fill="url(#end-l)"/>
    <rect x="1090" width="110" height="210" fill="url(#end-r)"/>
    <!-- faint creases near the ends -->
    <g stroke="#000" stroke-opacity=".10" stroke-width="3">
      <path d="M46 57 L52 118"/>
      <path d="M74 59 L80 121"/>
      <path d="M1154 57 L1148 118"/>
      <path d="M1126 59 L1120 121"/>
    </g>
  </g>
</svg>
