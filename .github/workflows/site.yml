name: site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # import.meta.glob aceita resultado vazio: sem este check, um build sem
      # artigos/figuras passaria verde (achado do review no draw-core #166).
      - run: node scripts/check-articles.mjs
