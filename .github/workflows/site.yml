name: site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/research/[0-9][0-9]-*.md' # os artigos entram no build do site
      - 'docs/research/figures/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/research/[0-9][0-9]-*.md' # os artigos entram no build do site
      - 'docs/research/figures/**'
      - '.github/workflows/site.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # import.meta.glob aceita resultado vazio: sem este check, um build sem
      # artigos/figuras passaria verde (achado do review no draw-core #166).
      - run: node scripts/check-articles.mjs
